  <a class="skip" href="#content">본문 바로가기</a>
  <header class="site-header">
    <div class="inner">
      <a class="logo" href="./">데이터<span>첫걸음</span></a>
      <nav class="site-nav" aria-label="주 메뉴">
        <ul>
          <li><a href="./">홈</a></li>

          <li><a href="contact.html" aria-current="page">문의</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="content">
    <h1 style="margin:0 0 8px;">문의하기</h1>
    <p style="color:var(--muted);margin:0 0 24px;">글의 오류 제보, 내용에 대한 질문, 다뤄 주었으면 하는 주제, 제휴 제안 모두 환영합니다. 입력하신 이메일로 답변드리겠습니다.</p>

    <div class="panel">
      <form class="form" action="https://formspree.io/f/xgakrjvo" method="POST">
        <input type="hidden" name="_subject" value="데이터 첫걸음 문의">

        <label for="name">이름</label>
        <input id="name" name="name" type="text" autocomplete="name" required>

        <label for="email">이메일</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="topic">문의 유형</label>
        <input id="topic" name="topic" type="text" placeholder="예: 오류 제보, 질문, 제휴">

        <label for="message">내용</label>
        <textarea id="message" name="message" required></textarea>

        <button class="btn" type="submit">보내기</button>
      </form>
      <p style="font-size:14px;color:var(--muted);margin:16px 0 0;">보내 주신 정보는 답변 목적으로만 사용합니다. 자세한 내용은 <a href="privacy.html">개인정보처리방침</a>을 참고해 주세요.</p>
    </div>

    <section aria-label="댓글" class="panel" style="margin-top:28px;">
      <h2 style="margin:0 0 16px;font-size:20px;">댓글</h2>
      <div id="disqus_thread"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="inner">
      <span>© 2026 데이터 첫걸음</span>
      <nav aria-label="하단 메뉴">
        <a href="about.html">소개</a><a href="privacy.html">개인정보처리방침</a><a href="contact.html">문의</a>
      </nav>
    </div>
  </footer>
