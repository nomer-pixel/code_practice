<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>제휴 문의</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2924409115830363"
     crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: #f3f6fb;
    }
    main {
      width: min(100%, 520px);
      padding: 32px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 28px rgb(31 41 55 / 10%);
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .description { margin: 0 0 24px; color: #667085; line-height: 1.6; }
    label { display: block; margin: 16px 0 7px; font-weight: 600; }
    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font: inherit;
    }
    input:focus, textarea:focus { outline: 2px solid #93b4ff; border-color: #2563eb; }
    textarea { min-height: 150px; resize: vertical; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px 20px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <main>
    <h1>제휴 문의</h1>
    <p class="description">제휴를 제안해 주세요. 내용을 확인한 뒤 입력하신 이메일로 연락드리겠습니다.</p>
    <form action="https://formspree.io/f/xgakrjvo" method="POST">
      <input type="hidden" name="_subject" value="새 제휴 문의">

      <label for="name">이름</label>
      <input id="name" name="name" type="text" autocomplete="name" required>

      <label for="email">이메일</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="company">회사명</label>
      <input id="company" name="company" type="text" autocomplete="organization">

      <label for="message">문의 내용</label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit">문의 보내기</button>
    </form>
  </main>
  <section aria-label="댓글" style="width: min(100%, 720px); margin: 32px auto 0; padding: 24px; border-radius: 16px; background: #fff; box-shadow: 0 8px 28px rgb(31 41 55 / 10%);">
    <h2 style="margin: 0 0 20px; font-size: 22px;">댓글</h2>
    <div id="disqus_thread"></div>
  </section>
  <script>
    if (window.location.protocol === "file:") {
      document.getElementById("disqus_thread").textContent =
        "Disqus 댓글은 페이지를 웹에 배포한 뒤 확인할 수 있습니다.";
    } else {
      var disqus_config = function () {
        this.page.url = window.location.origin + window.location.pathname;
        this.page.identifier = window.location.pathname;
      };

      (function () {
        var d = document;
        var s = d.createElement("script");
        s.src = "https://nomer.disqus.com/embed.js";
        s.setAttribute("data-timestamp", String(Date.now()));
        (d.head || d.body).appendChild(s);
      })();
    }
  </script>
  <noscript>댓글을 보려면 JavaScript를 활성화해 주세요. <a href="https://disqus.com/?ref_noscript">Disqus</a>에서 제공하는 댓글입니다.</noscript>
</body>
</html>
